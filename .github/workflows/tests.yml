name: Test game
on:
  pull_request:
    branches: [fix/hollowtide-loading-screen]
  push:
    branches: [graphics-preview]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build

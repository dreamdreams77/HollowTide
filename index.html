<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#120a24">
  <meta name="description" content="Hollow Tide: a claymation conspiracy adventure. Plays in the browser, installs as an app, works offline.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon-64.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hollow Tide">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hollow Tide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap">
  <style>
    /* Layout: one 16:9 stage, letterboxed to fit any viewport (container-query units keep the ratio exact). */
    :root { color-scheme: dark; --bg: #120a24; --ink: #e9d9b8; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
    body { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
    #wrap { position: relative; width: 100%; height: 100%; container-type: size; display: grid; place-items: center; }
    #wrap { --ar: 1.7778; }
    canvas { width: min(100cqw, calc(100cqh * var(--ar))); height: min(100cqh, calc(100cqw / var(--ar))); display: block; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; cursor: none; }
    /* Hand-built miniature-film finish: a soft lens vignette, warm edge light and restrained grain.
       These overlays sit above the canvas but never intercept pointer input. */
    #wrap::before, #wrap::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    #wrap::before {
      background:
        radial-gradient(ellipse at 50% 44%, transparent 48%, rgba(8, 5, 22, .18) 78%, rgba(5, 3, 15, .48) 112%),
        linear-gradient(180deg, rgba(255, 211, 151, .055), transparent 18%, transparent 82%, rgba(10, 5, 22, .16));
      mix-blend-mode: multiply;
    }
    #wrap::after {
      opacity: .105;
      background-image: repeating-radial-gradient(ellipse at 17% 23%, rgba(255, 244, 218, .22) 0 0.55px, transparent .8px 3.4px);
      background-size: 7px 7px;
      mix-blend-mode: soft-light;
    }
    #boot { z-index: 3; color: #f4dfba; text-shadow: 0 2px 16px rgba(255, 159, 105, .35); background: radial-gradient(ellipse, rgba(40, 18, 49, .35), transparent 62%); }
    @media (prefers-reduced-motion: reduce) { #wrap::after { opacity: .06; } }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540" aria-label="Hollow Tide game canvas"></canvas>
    <div id="boot">kneading the clay…</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

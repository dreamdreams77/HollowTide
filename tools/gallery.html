<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hollow Tide gallery</title>
  <style>
    html, body { margin: 0; background: #120a24; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c" width="960" height="540"></canvas>
  <script type="module">
    import { filmFinish } from '../src/engine/clay.js';
    import { drawFigure, drawEnemy, drawPortrait } from '../src/engine/actors.js';
    import * as stage from '../src/engine/stage.js';

    const q = new URLSearchParams(location.search);
    const what = q.get('what') || 'pier';
    const fr = Number(q.get('frame') || 7);
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');

    function party(y = 470, s = 1) {
      drawFigure(ctx, 'brine', 700, y, { frame: fr, facing: -1, scale: s });
      drawFigure(ctx, 'ochre', 250, y, { frame: fr, facing: 1, scale: s, talk: true });
      drawFigure(ctx, 'slip', 320, y + 6, { frame: fr, facing: 1, scale: s });
      drawFigure(ctx, 'marl', 400, y + 10, { frame: fr, facing: 1, scale: s, moving: true, step: 1 });
    }

    if (what === 'pier') { stage.paintPier(ctx, fr, {}); party(470); }
    else if (what === 'archive') { stage.paintArchive(ctx, fr, { lamps: [1,0,1,0,1,0,1,0,1].map(Boolean) }); party(470); }
    else if (what === 'chapel') { stage.paintChapel(ctx, fr, { pressed: ['mouth'] }); party(470); }
    else if (what === 'kiln') { stage.paintKiln(ctx, fr, {}); party(480); }
    else if (what === 'title') { stage.paintTitle(ctx, fr); }
    else if (what === 'battle') {
      stage.paintBattleBG(ctx, 'kiln', fr);
      drawEnemy(ctx, 'warden', 230, 400, { frame: fr });
      drawFigure(ctx, 'marl', 700, 400, { frame: fr, facing: -1, scale: 1.1 });
      drawFigure(ctx, 'ochre', 790, 450, { frame: fr, facing: -1, scale: 1.1 });
    } else if (what === 'monsters') {
      stage.paintBattleBG(ctx, 'archive', fr);
      drawEnemy(ctx, 'husk', 150, 420, { frame: fr });
      drawEnemy(ctx, 'kilnwright', 340, 440, { frame: fr });
      drawEnemy(ctx, 'eel', 560, 440, { frame: fr });
      drawEnemy(ctx, 'husk', 720, 460, { frame: fr, flash: true });
      drawPortrait(ctx, 'marl', 860, 120, 60, { frame: fr, talk: true });
      drawPortrait(ctx, 'slip', 860, 250, 60, { frame: fr });
    } else if (what === 'closeup') {
      // magnify the clay shading
      ctx.fillStyle = '#2a2040'; ctx.fillRect(0, 0, 960, 540);
      ctx.save(); ctx.scale(3.2, 3.2);
      drawFigure(ctx, 'marl', 90, 160, { frame: fr, facing: 1 });
      drawFigure(ctx, 'ochre', 200, 160, { frame: fr, facing: 1 });
      ctx.restore();
    }
    filmFinish(ctx, 960, 540, fr);
    document.title = 'ready';
  </script>
</body>
</html>
